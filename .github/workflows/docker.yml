name: LifeOS Docker CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  docker-build:
    name: Build LifeOS Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: false
          tags: lifeos-api:test

      - name: Build Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: dashboard
          push: false
          tags: lifeos-dashboard:test